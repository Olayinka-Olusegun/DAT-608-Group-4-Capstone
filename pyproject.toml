[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pau-lga-risk"
version = "0.1.0"
description = "Predictive LGA-level violence risk scoring for Nigerian state governments"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
pau-risk = "pau_risk.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pau_risk = ["schemas/*.avsc"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Raised inside pandas whenever a Timedelta is constructed under NumPy 2.5.
    # It is an upstream interaction, not something this code controls.
    "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning",
]
